# The model servers ZERO knows out of the box (servers.py). The user's
# models.toml adds servers of their own and changes any line here by naming
# the same server. Each server: title (what the screens show), url,
# key_env (the variable its key may come from; a key is then needed),
# reply_api (the catalog's preferred API on this URL, with exact model
# exceptions below), api (an explicitly configured API, which takes priority),
# responses_url (the provider's separate Responses base, when it has one),
# responses_since_version (the first release with Responses, for the local
# server whose version is available at /api/version),
# price (USD per 1M tokens at peak: cache hit, miss, output),
# refuses_overlong_requests (whether the server rejects overlong requests).
# [server.models] contains individual model settings and exact limits from
# provider documentation. The generated limits.toml and prices.toml carry
# the remaining published limits and prices.
# models_dev_provider is the provider ID used for that public catalog.
#
# search_api names the separate lookup contract, with search_model where that
# API runs an isolated model request. The user can choose a search service
# by its model server name. A different server URL needs its own declaration.
# bare_model_names marks the server for model names without a server prefix.
# max_reasoning_effort overrides the wire value that the UI calls "max".
# reasoning_efforts names supported explicit choices. An absent list means
# unverified. API-specific declarations override shared choices.
# chat_tool_efforts lists choices usable with functions on Chat.
# chat_thinking_field names the provider's own Chat field.
# replays_encrypted_reasoning requests and replays encrypted reasoning items.
# replays_response_items controls whether opaque Responses output items replay.
# requests_reasoning_summary asks Responses servers for reasoning summaries.
# suggested_models are starter entries shown before the server lists models.

[deepseek]
models_dev_provider = "deepseek"
title = "DeepSeek"
url = "https://api.deepseek.com"
key_env = "DEEPSEEK_API_KEY"
replays_response_items = false
suggested_models = ["deepseek-flash", "deepseek-v4-pro"]
search_api = "deepseek_search"
# Tried: 1.78M tokens came back 400, "maximum context length is 1048576"
refuses_overlong_requests = true

[deepseek.models]
# Off-peak prices are half these
"deepseek-v4-pro" = { reasoning_efforts = ["off", "low", "high", "max"] }

[deepseek.models."deepseek-flash"]
price = [0.006, 0.3, 1.2]
reasoning_efforts = ["off", "low", "high", "max"]

[ollama]
title = "Ollama (on this computer)"
url = "http://localhost:11434/v1"
bare_model_names = true
responses_since_version = [0, 13, 3]

[openai]
