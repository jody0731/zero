<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZERO</title>
<link rel="icon" type="image/svg+xml" href="/ui/favicon-light-still.svg"
      media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="/ui/favicon-dark-still.svg"
      media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/ui/style.css">
<script type="module" src="/ui/app.js"></script>
</head>
<body>
<div id="frame" class="frame">
  <aside id="sessions" class="panel sessions" aria-label="Sessions">
    <header class="panel-head">
      <picture class="brand">
        <source media="(prefers-reduced-motion: reduce) and
                       (prefers-color-scheme: dark)"
                srcset="/ui/wordmark-dark-still.svg">
        <source media="(prefers-reduced-motion: reduce)"
                srcset="/ui/wordmark-light-still.svg">
        <source media="(prefers-color-scheme: dark)"
                srcset="/ui/wordmark-dark.svg">
        <img src="/ui/wordmark-light.svg" alt="ZERO" width="174" height="64">
      </picture>
    </header>
    <button id="new-session" class="new-session" type="button" disabled>
      + New session
    </button>
    <ul id="session-list" class="session-list" role="list"></ul>
    <button id="archived" aria-label="Archived" type="button">Archived</button>
    <button id="settings-open" aria-label="Settings" type="button">Settings</button>
    <footer id="server-state" class="server-state" aria-live="polite"></footer>
  </aside>
  <div class="handle" data-handle="left"></div>
  <main id="session" class="panel session" aria-label="Session">
    <header class="panel-head session-head">
      <button id="back" class="ghost back" type="button"
              aria-label="Sessions">‹</button>
      <div class="titles">
        <h1><button id="session-title" type="button"
                    title="Rename session"></button></h1>
      </div>
      <button id="details-toggle" class="ghost" type="button"
              aria-label="Expand side panel" title="Expand side panel">◧</button>
    </header>
    <div id="timeline" class="timeline" tabindex="0"
         aria-label="Timeline"></div>
    <button id="follow" class="follow" type="button" hidden
            aria-label="Newest">↓</button>
    <section id="ask" class="ask" hidden aria-live="polite"></section>
    <form id="composer" class="composer" autocomplete="off">
      <div id="commands" class="command-list" hidden></div>
      <textarea id="text" rows="2"
                placeholder="Message" aria-label="Message"></textarea>
      <div class="composer-row">
        <label class="queue"><input id="queue" type="checkbox"> Queue</label>
        <span id="draft-status" class="sub" role="status"></span>
        <span class="spacer"></span>
        <button id="stop" type="button" hidden>Stop</button>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
      <div id="usage" class="sub"></div>
    </form>
  </main>
  <div class="handle" data-handle="right"></div>
  <aside id="details" class="panel details" aria-label="Details"></aside>
</div>
<dialog id="settings-dialog" class="dialog settings-dialog">
  <header class="panel-head">
    <h2>Settings</h2>
    <button id="settings-close" type="button">Back</button>
  </header>
  <nav id="settings-tabs" aria-label="Settings views"></nav>
  <section id="settings-body"></section>
</dialog>
</body>
</html>
